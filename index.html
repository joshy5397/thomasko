<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ഡയറക്ടറി & ഡാഷ്‌ബോർഡ്</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1100px;
      margin: auto;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    h2 {
      margin-top: 0;
      color: #1a73e8;
    }
    .search-box {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 20px;
      outline: none;
    }
    .search-box:focus {
      border-color: #1a73e8;
    }
    .table-responsive {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 12px 14px;
      text-align: left;
    }
    th {
      background: #f8fafc;
      font-weight: 600;
      color: #475569;
    }
    tr:hover {
      background: #f1f5f9;
    }
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 18px;
      color: #64748b;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>ലൈവ് ഡാറ്റാ ഡയറക്ടറി</h2>
  <input type="text" id="searchInput" class="search-box" placeholder="തിരയുക (Search)..." onkeyup="filterTable()">
  
  <div id="loading" class="loading">വിവരങ്ങൾ ലോഡ് ചെയ്യുന്നു... ദയവായി കാത്തിരിക്കുക.</div>
  
  <div class="table-responsive">
    <table id="dataTable" style="display: none;">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  // നിങ്ങളുടെ Google Sheet ID താഴെയുള്ള വരിയിൽ നൽകുക
  const SHEET_ID = 'YOUR_GOOGLE_SHEET_ID_HERE';
  const SHEET_NAME = 'Sheet1'; // ഷീറ്റ് ടാബിന്റെ പേര്

  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

  fetch(url)
    .then(res => res.text())
    .then(data => {
      // JSON ഡാറ്റ പാഴ്‌സ് ചെയ്യുന്നു
      const json = JSON.parse(data.substr(47).slice(0, -2));
      const cols = json.table.cols;
      const rows = json.table.rows;

      // ടേബിൾ ഹെഡർ
      let headHtml = '<tr>';
      cols.forEach(col => {
        headHtml += `<th>${col.label || ''}</th>`;
      });
      headHtml += '</tr>';
      document.getElementById('tableHead').innerHTML = headHtml;

      // ടേബിൾ വരികൾ
      let bodyHtml = '';
      rows.forEach(row => {
        bodyHtml += '<tr>';
        row.c.forEach(cell => {
          bodyHtml += `<td>${cell ? (cell.f || cell.v || '') : ''}</td>`;
        });
        bodyHtml += '</tr>';
      });
      document.getElementById('tableBody').innerHTML = bodyHtml;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('dataTable').style.display = 'table';
    })
    .catch(err => {
      document.getElementById('loading').innerHTML = 'ഡാറ്റ ലോഡ് ചെയ്യുന്നതിൽ തടസ്സം നേരിട്ടു. Google Sheet ID-യും Share Permissions-ഉം പരിശോധിക്കുക.';
      console.error(err);
    });

  function filterTable() {
    const input = document.getElementById("searchInput").value.toLowerCase();
    const rows = document.getElementById("tableBody").getElementsByTagName("tr");
    for (let i = 0; i < rows.length; i++) {
      rows[i].style.display = rows[i].innerText.toLowerCase().includes(input) ? "" : "none";
    }
  }
</script>

</body>
</html>
