<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>കുടുംബവൃക്ഷം (Horizontal Family Tree)</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #f1f5f9;
      margin: 0;
      padding: 16px;
      color: #0f172a;
    }
    .top-panel {
      position: sticky;
      top: 10px;
      z-index: 100;
      background: #ffffff;
      padding: 18px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      max-width: 900px;
      margin: 0 auto 20px auto;
    }
    h2 {
      margin: 0 0 14px 0;
      color: #1e3a8a;
      text-align: center;
      font-size: 22px;
    }
    .search-wrapper {
      position: relative;
      margin-bottom: 12px;
    }
    .search-input {
      width: 100%;
      padding: 12px 18px 12px 42px;
      font-size: 15px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      background: #f8fafc;
    }
    .search-input:focus {
      border-color: #2563eb;
      background: #ffffff;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 16px;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .legend {
      display: flex;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-first { background: #1e3a8a; color: white; padding: 2px 8px; border-radius: 6px; }
    .badge-second { background: #0284c7; color: white; padding: 2px 8px; border-radius: 6px; }
    .badge-third { background: #059669; color: white; padding: 2px 8px; border-radius: 6px; }
    .badge-fourth { background: #d97706; color: white; padding: 2px 8px; border-radius: 6px; }

    .btn-ctrl {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: #334155;
    }
    .btn-ctrl:hover { background: #e2e8f0; }

    /* Horizontal Tree Layout (Left to Right) */
    .tree-wrapper {
      width: 100%;
      overflow-x: auto;
      overflow-y: visible;
      padding: 20px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.05);
      min-height: 450px;
    }
    .tree-h, .tree-h ul {
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin: 0;
      padding: 0 0 0 35px;
      position: relative;
      list-style: none;
    }
    .tree-h > li {
      display: flex;
      align-items: center;
      margin: 10px 0;
      position: relative;
    }
    /* Horizontal lines connecting Left to Right */
    .tree-h ul::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      bottom: 50%;
      border-left: 2px solid #94a3b8;
    }
    .tree-h li::before {
      content: '';
      position: absolute;
      left: -35px;
      width: 35px;
      height: 2px;
      background-color: #94a3b8;
      top: 50%;
    }
    .tree-h li:first-child::after, .tree-h li:last-child::after {
      content: '';
      position: absolute;
      left: -35px;
      border-left: 2px solid #94a3b8;
      width: 0;
    }
    .tree-h li:first-child::after {
      top: 50%;
      bottom: 0;
    }
    .tree-h li:last-child::after {
      top: 0;
      bottom: 50%;
    }
    .tree-h li:only-child::after {
      display: none;
    }
    .tree-h li > .node-card {
      margin-right: 35px;
      position: relative;
    }
    .tree-h li:has(> ul) > .node-card::after {
      content: '';
      position: absolute;
      right: -35px;
      top: 50%;
      width: 35px;
      height: 2px;
      background-color: #94a3b8;
    }

    /* Node Box Design */
    .node-card {
      min-width: 130px;
      padding: 10px 14px;
      background: #ffffff;
      border-radius: 10px;
      border: 2px solid #cbd5e1;
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      transition: all 0.2s ease;
      white-space: nowrap;
      user-select: none;
    }
    .node-card:hover {
      box-shadow: 0 4px 12px rgba(37,99,235,0.18);
      border-color: #2563eb;
    }
    .node-name {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .node-gen {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* Generation Specific Styles */
    .gen-1 > .node-card { border-color: #1e3a8a; background: #eff6ff; }
    .gen-1 .node-gen { background: #1e3a8a; color: white; }

    .gen-2 > .node-card { border-color: #0284c7; }
    .gen-2 .node-gen { background: #e0f2fe; color: #0284c7; }

    .gen-3 > .node-card { border-color: #059669; }
    .gen-3 .node-gen { background: #d1fae5; color: #059669; }

    .gen-4 > .node-card { border-color: #d97706; }
    .gen-4 .node-gen { background: #fef3c7; color: #d97706; }

    /* Collapsible */
    .collapsed > ul {
      display: none !important;
    }
    .toggle-icon {
      font-size: 11px;
      color: #64748b;
      margin-left: auto;
    }
    .collapsed .toggle-icon {
      transform: rotate(-90deg);
    }
    .highlight > .node-card {
      background: #fef08a !important;
      border-color: #ca8a04 !important;
      color: #854d0e !important;
      transform: scale(1.04);
      box-shadow: 0 0 12px rgba(202, 138, 4, 0.4);
    }
    .status-msg {
      text-align: center;
      padding: 40px;
      color: #64748b;
      font-size: 16px;
    }
  </style>
</head>
<body>

<div class="top-panel">
  <h2><i class="fa-solid fa-sitemap"></i> കുടുംബവൃക്ഷം</h2>
  
  <div class="search-wrapper">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="text" id="searchInput" class="search-input" placeholder="കുടുംബാംഗങ്ങളുടെ പേര് തിരയുക..." oninput="searchTree()">
  </div>

  <div class="controls">
    <div class="legend">
      <span class="badge-first">FIRST</span>
      <span class="badge-second">SECOND</span>
      <span class="badge-third">THIRD</span>
      <span class="badge-fourth">FOURTH</span>
    </div>
    <div>
      <button class="btn-ctrl" onclick="expandAll()"><i class="fa-solid fa-expand"></i> Expand All</button>
      <button class="btn-ctrl" onclick="collapseAll()"><i class="fa-solid fa-compress"></i> Collapse All</button>
    </div>
  </div>
</div>

<div class="tree-wrapper">
  <div id="status" class="status-msg">വിവരങ്ങൾ ലോഡ് ചെയ്യുന്നു... ദയവായി കാത്തിരിക്കുക.</div>
  <div id="treeContainer"></div>
</div>

<script>
  const SHEET_ID = '1sfz7C3ujn6pQQky8W4YY5YAFobe7mNWrU6hfIgcDKF0';
  const SHEET_NAME = 'Sheet1';
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}&headers=0`;

  let treeData = null;

  fetch(url)
    .then(res => res.text())
    .then(data => {
      const match = data.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\);/);
      if (!match) throw new Error("Invalid response");
      const json = JSON.parse(match[1]);
      const rows = json.table.rows;

      if (!rows || rows.length < 2) {
        document.getElementById('status').innerText = 'ഷീറ്റിൽ ഡാറ്റ ലഭ്യമല്ല.';
        return;
      }

      const colHeaders = rows[0].c.map(c => c && (c.v !== null || c.f) ? String(c.f || c.v).trim().toUpperCase() : '');

      let root = {};

      for (let i = 1; i < rows.length; i++) {
        const c = rows[i].c;
        if (!c || c.every(cell => !cell || cell.v === null || cell.v === '')) continue;

        let currentLevel = root;
        for (let col = 0; col < c.length; col++) {
          let name = (c[col] && (c[col].f || c[col].v !== null)) ? String(c[col].f || c[col].v).trim() : '';
          if (!name) break;

          let headerName = colHeaders[col] || `GEN ${col + 1}`;

          if (!currentLevel[name]) {
            currentLevel[name] = {
              _gen: col + 1,
              _badge: headerName,
              _children: {}
            };
          }
          currentLevel = currentLevel[name]._children;
        }
      }

      treeData = root;
      renderTree(root);
      document.getElementById('status').style.display = 'none';
    })
    .catch(err => {
      document.getElementById('status').innerText = 'ഡാറ്റ ലോഡ് ചെയ്യാൻ കഴിഞ്ഞില്ല: ' + err.message;
    });

  function buildTreeHtml(nodeObj) {
    let keys = Object.keys(nodeObj);
    if (keys.length === 0) return '';

    let html = '<ul>';
    keys.forEach(key => {
      const node = nodeObj[key];
      const hasChildren = Object.keys(node._children).length > 0;
      const genClass = `gen-${node._gen}`;

      html += `<li class="${genClass}" data-name="${key.toLowerCase()}">`;
      html += `  <div class="node-card" onclick="toggleNode(this)">
                   <span class="node-gen">${node._badge}</span>
                   <div class="node-name">
                     <span>${key}</span>
                     ${hasChildren ? '<i class="fa-solid fa-chevron-right toggle-icon"></i>' : ''}
                   </div>
                 </div>`;
      if (hasChildren) {
        html += buildTreeHtml(node._children);
      }
      html += '</li>';
    });
    html += '</ul>';
    return html;
  }

  function renderTree(root) {
    const container = document.getElementById('treeContainer');
    let html = '<ul class="tree-h">' + buildTreeHtml(root).replace(/^<ul>|<\/ul>$/g, '') + '</ul>';
    container.innerHTML = html;
  }

  function toggleNode(card) {
    const li = card.closest('li');
    li.classList.toggle('collapsed');
  }

  function expandAll() {
    document.querySelectorAll('#treeContainer li').forEach(li => li.classList.remove('collapsed'));
  }

  function collapseAll() {
    document.querySelectorAll('#treeContainer li').forEach(li => {
      if (li.querySelector('ul')) li.classList.add('collapsed');
    });
    document.querySelectorAll('#treeContainer > ul > li').forEach(li => li.classList.remove('collapsed'));
  }

  function searchTree() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const allLis = document.querySelectorAll('#treeContainer li');

    allLis.forEach(li => li.classList.remove('highlight'));
    if (!query) return;

    expandAll();

    allLis.forEach(li => {
      const name = li.getAttribute('data-name');
      if (name && name.includes(query)) {
        li.classList.add('highlight');
      }
    });
  }
</script>

</body>
</html>
