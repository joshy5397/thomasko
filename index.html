<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>കുടുംബവൃക്ഷം - Family Tree</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #0f172a;
      margin: 0;
      padding: 0;
      color: #f8fafc;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Floating Header */
    .top-header {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 100;
    }
    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
    .search-box {
      flex: 1;
      max-width: 400px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 9px 14px 9px 36px;
      border-radius: 20px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 14px;
    }
    .controls {
      display: flex;
      gap: 8px;
    }
    .btn-action {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: #334155;
      color: #fff;
    }

    /* Viewport Area */
    .viewport {
      flex: 1;
      overflow: auto;
      position: relative;
      background: radial-gradient(#1e293b 1px, #0f172a 1px);
      background-size: 24px 24px;
      cursor: grab;
      padding: 60px;
    }
    .viewport:active {
      cursor: grabbing;
    }

    /* Horizontal Tree Layout */
    .tree-container {
      display: inline-flex;
      align-items: center;
      min-width: 100%;
      min-height: 100%;
    }
    .tree-node-wrapper {
      display: flex;
      align-items: center;
      position: relative;
    }
    .tree-children {
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-left: 50px;
      position: relative;
      gap: 20px;
    }

    /* Connector Branch Lines */
    .tree-children::before {
      content: '';
      position: absolute;
      left: -25px;
      top: 25px;
      bottom: 25px;
      width: 2px;
      background: #475569;
    }
    .tree-child-item {
      display: flex;
      align-items: center;
      position: relative;
    }
    .tree-child-item::before {
      content: '';
      position: absolute;
      left: -25px;
      top: 50%;
      width: 25px;
      height: 2px;
      background: #475569;
    }
    .tree-node-wrapper:has(> .tree-children) > .node-card::after {
      content: '';
      position: absolute;
      right: -25px;
      top: 50%;
      width: 25px;
      height: 2px;
      background: #475569;
    }

    /* Glassmorphism Node Cards */
    .node-card {
      position: relative;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border-radius: 14px;
      padding: 12px 18px;
      min-width: 170px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      white-space: nowrap;
    }
    .node-card:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
    }

    /* Generation Styles */
    .gen-1 > .node-card {
      background: linear-gradient(135deg, #1e3a8a, #172554);
      border-color: #3b82f6;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.35);
      min-width: 200px;
    }
    .gen-1 .avatar { background: #3b82f6; color: white; }
    .gen-1 .gen-tag { background: rgba(59, 130, 246, 0.3); color: #93c5fd; }

    .gen-2 > .node-card { border-left: 4px solid #06b6d4; }
    .gen-2 .avatar { background: #06b6d4; color: white; }
    .gen-2 .gen-tag { background: rgba(6, 182, 212, 0.2); color: #67e8f9; }

    .gen-3 > .node-card { border-left: 4px solid #10b981; }
    .gen-3 .avatar { background: #10b981; color: white; }
    .gen-3 .gen-tag { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }

    .gen-4 > .node-card { border-left: 4px solid #f59e0b; }
    .gen-4 .avatar { background: #f59e0b; color: white; }
    .gen-4 .gen-tag { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
    }
    .node-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .gen-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2px 6px;
      border-radius: 4px;
      align-self: flex-start;
      text-transform: uppercase;
    }
    .node-name {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
    }
    .child-count {
      font-size: 11px;
      color: #94a3b8;
    }

    .expand-badge {
      margin-left: auto;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #94a3b8;
      transition: transform 0.2s;
    }
    .tree-node-wrapper.collapsed > .tree-children {
      display: none;
    }
    .tree-node-wrapper.collapsed > .node-card .expand-badge {
      transform: rotate(-90deg);
      background: #38bdf8;
      color: #0f172a;
    }

    /* Highlight Search Match */
    .highlight > .node-card {
      border: 2px solid #facc15 !important;
      background: rgba(250, 204, 21, 0.2) !important;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.6) !important;
      transform: scale(1.05);
    }

    .loading-view {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="header-title">
      <i class="fa-solid fa-sitemap"></i> കുടുംബവൃക്ഷം
    </div>
    
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="പേര് തിരയുക (Search Member)..." oninput="searchTree()">
    </div>

    <div class="controls">
      <button class="btn-action" onclick="expandAll()"><i class="fa-solid fa-expand"></i> Expand</button>
      <button class="btn-action" onclick="collapseAll()"><i class="fa-solid fa-compress"></i> Collapse</button>
    </div>
  </div>

  <div class="viewport" id="viewport">
    <div id="loading" class="loading-view">
      <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: #38bdf8; margin-bottom: 12px;"></i><br>
      വിവരങ്ങൾ ശേഖരിക്കുന്നു...
    </div>
    <div class="tree-container" id="treeContainer"></div>
  </div>

<script>
  const SHEET_ID = '1sfz7C3ujn6pQQky8W4YY5YAFobe7mNWrU6hfIgcDKF0';
  const SHEET_NAME = 'Sheet1';
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}&headers=0`;

  let treeRoot = {};

  fetch(url)
    .then(res => res.text())
    .then(data => {
      const match = data.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\);/);
      if (!match) return;
      const json = JSON.parse(match[1]);
      const rows = json.table.rows;

      if (!rows || rows.length < 2) return;

      const colHeaders = rows[0].c.map(c => c && (c.v !== null || c.f) ? String(c.f || c.v).trim().toUpperCase() : '');

      let root = {};

      for (let i = 1; i < rows.length; i++) {
        const c = rows[i].c;
        if (!c || c.every(cell => !cell || cell.v === null || cell.v === '')) continue;

        let current = root;
        for (let col = 0; col < c.length; col++) {
          let name = (c[col] && (c[col].f || c[col].v !== null)) ? String(c[col].f || c[col].v).trim() : '';
          if (!name) break;

          let badge = colHeaders[col] || `GEN ${col + 1}`;

          if (!current[name]) {
            current[name] = {
              _name: name,
              _gen: col + 1,
              _badge: badge,
              _children: {}
            };
          }
          current = current[name]._children;
        }
      }

      treeRoot = root;
      renderInteractiveTree(root);
      document.getElementById('loading').style.display = 'none';
    })
    .catch(err => {
      document.getElementById('loading').innerHTML = 'ഡാറ്റ ലോഡ് ചെയ്യാൻ സാധിച്ചില്ല: ' + err.message;
    });

  function buildNodeHtml(node) {
    const childKeys = Object.keys(node._children);
    const hasChildren = childKeys.length > 0;
    const initial = node._name.charAt(0).toUpperCase();

    let html = `<div class="tree-node-wrapper gen-${node._gen}" data-name="${node._name.toLowerCase()}">`;
    html += `
      <div class="node-card" onclick="toggleNode(this)">
        <div class="avatar">${initial}</div>
        <div class="node-details">
          <span class="gen-tag">${node._badge}</span>
          <span class="node-name">${node._name}</span>
          ${hasChildren ? `<span class="child-count">${childKeys.length} Members</span>` : ''}
        </div>
        ${hasChildren ? `<div class="expand-badge"><i class="fa-solid fa-chevron-right"></i></div>` : ''}
      </div>
    `;

    if (hasChildren) {
      html += `<div class="tree-children">`;
      childKeys.forEach(key => {
        html += `<div class="tree-child-item">`;
        html += buildNodeHtml(node._children[key]);
        html += `</div>`;
      });
      html += `</div>`;
    }

    html += `</div>`;
    return html;
  }

  function renderInteractiveTree(root) {
    const container = document.getElementById('treeContainer');
    let html = '';
    Object.keys(root).forEach(key => {
      html += buildNodeHtml(root[key]);
    });
    container.innerHTML = html;
  }

  function toggleNode(card) {
    const wrapper = card.closest('.tree-node-wrapper');
    wrapper.classList.toggle('collapsed');
  }

  function expandAll() {
    document.querySelectorAll('.tree-node-wrapper').forEach(el => el.classList.remove('collapsed'));
  }

  function collapseAll() {
    document.querySelectorAll('.tree-node-wrapper').forEach(el => {
      if (el.querySelector('.tree-children')) {
        el.classList.add('collapsed');
      }
    });
    // First generation open
    document.querySelectorAll('#treeContainer > .tree-node-wrapper').forEach(el => el.classList.remove('collapsed'));
  }

  function searchTree() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const wrappers = document.querySelectorAll('.tree-node-wrapper');

    wrappers.forEach(w => w.classList.remove('highlight'));
    if (!query) return;

    expandAll();

    wrappers.forEach(w => {
      const name = w.getAttribute('data-name');
      if (name && name.includes(query)) {
        w.classList.add('highlight');
        // Scroll to matched item smoothly
        w.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
      }
    });
  }
</script>

</body>
</html>
