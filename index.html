<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ഡയറക്ടറി & കോൺടാക്റ്റുകൾ</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #f1f5f9;
      margin: 0;
      padding: 16px;
      color: #0f172a;
    }
    .container {
      max-width: 1000px;
      margin: auto;
    }
    .header-section {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    h2 {
      margin: 0 0 16px 0;
      color: #1e3a8a;
      font-size: 24px;
      text-align: center;
    }
    .search-wrapper {
      position: relative;
      margin-bottom: 20px;
    }
    .search-input {
      width: 100%;
      padding: 14px 20px 14px 44px;
      font-size: 16px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      background: #f8fafc;
    }
    .search-input:focus {
      border-color: #2563eb;
      background: #ffffff;
    }
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 18px;
    }
    .category-title {
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pill {
      padding: 9px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      cursor: pointer;
    }
    .pill:hover {
      background: #e2e8f0;
    }
    .pill.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
    .status-msg {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-size: 16px;
    }
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      background: #eff6ff;
      color: #2563eb;
      margin-bottom: 8px;
      align-self: flex-start;
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: 13px;
      color: #475569;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-action {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    .btn-call {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }
    .btn-wa {
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }
    .btn-link {
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-section">
    <h2><i class="fa-solid fa-address-book"></i> ഡയറക്ടറി</h2>
    
    <div class="search-wrapper">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="തിരയുക (പേര്, ഓഫീസ്, ഫോൺ നമ്പർ...)" oninput="filterAndDisplay()">
    </div>

    <div class="category-title"><i class="fa-solid fa-layer-group"></i> കാറ്റഗറി തിരഞ്ഞെടുക്കുക:</div>
    <div class="category-pills" id="categoryContainer"></div>
  </div>

  <div id="statusMessage" class="status-msg">
    വിവരങ്ങൾ ലോഡ് ചെയ്യുന്നു...
  </div>

  <div class="results-grid" id="resultsGrid" style="display: none;"></div>
</div>

<script>
  const SHEET_ID = '1pqVwS9RBS4bYOXvVVVzF406qUna4MwvHxq_1ElBJZ5Q';
  const SHEET_NAME = 'Sheet1';
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}&headers=0`;

  let directoryData = [];
  let selectedCategory = '';

  fetch(url)
    .then(res => res.text())
    .then(data => {
      const match = data.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\);/);
      if (!match) return;
      const json = JSON.parse(match[1]);
      const rows = json.table.rows;

      if (!rows || rows.length < 2) return;

      const categoriesSet = new Set();

      // വരികൾ നേരിട്ട് റീഡ് ചെയ്യുന്നു
      for (let i = 1; i < rows.length; i++) {
        const c = rows[i].c;
        if (!c || c.every(cell => !cell || cell.v === null || cell.v === '')) continue;

        const val = (idx) => (c[idx] && (c[idx].f || c[idx].v !== null)) ? String(c[idx].f || c[idx].v).trim() : '';

        // നിരകൾ: 0=Category, 1=SubCategory, 2=SiteName, 3=Link, 4=Unit, 5=Name, 6=Designation, 7=Phone1, 8=Phone2
        const category = val(0) || 'OTHER';
        const subCategory = val(1);
        const siteName = val(2);
        const link = val(3);
        const unit = val(4);
        const personName = val(5);
        const desig = val(6);
        const phone1 = val(7);
        const phone2 = val(8);

        // പ്രധാന ഫോൺ നമ്പർ കണ്ടെത്തുന്നു
        let activePhone = phone2 || phone1;
        let cleanPhone = activePhone.replace(/[^0-9]/g, '');

        // പ്രധാന തലക്കെട്ട്
        let displayTitle = personName || siteName || unit || subCategory || 'വിവരങ്ങൾ';

        if (category) categoriesSet.add(category);

        directoryData.push({
          category,
          subCategory,
          siteName,
          link,
          unit,
          personName,
          desig,
          phone: cleanPhone,
          rawPhone: activePhone,
          title: displayTitle
        });
      }

      renderCategories(Array.from(categoriesSet));
      document.getElementById('statusMessage').innerHTML = '👆 മുകളിൽ ഒരു <b>കാറ്റഗറി ക്ലിക്ക് ചെയ്യുക</b> അല്ലെങ്കിൽ <b>തിരയുക</b>.';
    })
    .catch(err => {
      document.getElementById('statusMessage').innerText = 'ഡാറ്റ ലോഡ് ചെയ്യാൻ കഴിഞ്ഞില്ല: ' + err.message;
    });

  function renderCategories(categories) {
    const container = document.getElementById('categoryContainer');
    let html = '';
    categories.forEach(cat => {
      html += `<button class="pill" onclick="selectCategory('${cat}', this)">${cat}</button>`;
    });
    container.innerHTML = html;
  }

  function selectCategory(cat, btn) {
    if (selectedCategory === cat) {
      selectedCategory = '';
      btn.classList.remove('active');
    } else {
      selectedCategory = cat;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
    }
    filterAndDisplay();
  }

  function filterAndDisplay() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const grid = document.getElementById('resultsGrid');
    const statusMsg = document.getElementById('statusMessage');

    if (!selectedCategory && !query) {
      grid.style.display = 'none';
      statusMsg.style.display = 'block';
      statusMsg.innerHTML = '👆 മുകളിൽ ഒരു <b>കാറ്റഗറി ക്ലിക്ക് ചെയ്യുക</b> അല്ലെങ്കിൽ <b>തിരയുക</b>.';
      return;
    }

    const filtered = directoryData.filter(item => {
      const matchCat = selectedCategory ? item.category === selectedCategory : true;
      const matchQuery = query ? (
        item.title.toLowerCase().includes(query) ||
        item.unit.toLowerCase().includes(query) ||
        item.category.toLowerCase().includes(query) ||
        item.phone.includes(query) ||
        item.desig.toLowerCase().includes(query)
      ) : true;
      return matchCat && matchQuery;
    });

    if (filtered.length === 0) {
      grid.style.display = 'none';
      statusMsg.style.display = 'block';
      statusMsg.innerText = 'വിവരങ്ങൾ ഒന്നും കണ്ടെത്താൻ കഴിഞ്ഞില്ല.';
      return;
    }

    statusMsg.style.display = 'none';
    grid.style.display = 'grid';

    grid.innerHTML = filtered.map(item => `
      <div class="card">
        <div>
          <span class="card-badge">${item.category}</span>
          <div class="card-title">${item.title}</div>
          <div class="card-sub">
            ${item.unit ? `🏢 <b>Unit:</b> ${item.unit}<br>` : ''}
            ${item.desig ? `💼 <b>Designation:</b> ${item.desig}<br>` : ''}
            ${item.rawPhone ? `📞 <b>Phone:</b> ${item.rawPhone}` : ''}
          </div>
        </div>
        
        <div class="card-actions">
          ${item.phone ? `
            <a href="tel:${item.phone}" class="btn-action btn-call"><i class="fa-solid fa-phone"></i> Call</a>
            <a href="https://wa.me/91${item.phone.slice(-10)}" target="_blank" class="btn-action btn-wa"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
          ` : ''}
          ${item.link ? `
            <a href="${item.link}" target="_blank" class="btn-action btn-link"><i class="fa-solid fa-arrow-up-right-from-square"></i> Visit</a>
          ` : ''}
        </div>
      </div>
    `).join('');
  }
</script>

</body>
</html>
