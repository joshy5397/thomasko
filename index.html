<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ഡയറക്ടറി & കോൺടാക്റ്റുകൾ</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #f1f5f9;
      margin: 0;
      padding: 16px;
      color: #0f172a;
    }
    .container {
      max-width: 1000px;
      margin: auto;
    }
    .header-section {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    h2 {
      margin: 0 0 16px 0;
      color: #1e3a8a;
      font-size: 24px;
      text-align: center;
    }
    .search-wrapper {
      position: relative;
      margin-bottom: 20px;
    }
    .search-input {
      width: 100%;
      padding: 14px 20px 14px 44px;
      font-size: 16px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      background: #f8fafc;
    }
    .search-input:focus {
      border-color: #2563eb;
      background: #ffffff;
    }
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 18px;
    }
    .category-title {
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pill {
      padding: 9px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      cursor: pointer;
    }
    .pill:hover {
      background: #e2e8f0;
    }
    .pill.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
    .status-msg {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-size: 16px;
    }
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      background: #eff6ff;
      color: #2563eb;
      margin-bottom: 8px;
      align-self: flex-start;
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: 13px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-action {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    .btn-call {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }
    .btn-call:hover {
      background: #d1fae5;
    }
    .btn-wa {
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }
    .btn-wa:hover {
      background: #dcfce7;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-section">
    <h2><i class="fa-solid fa-address-book"></i> ഡയറക്ടറി</h2>
    
    <div class="search-wrapper">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="തിരയുക (പേര്, ഓഫീസ്, ഫോൺ നമ്പർ...)" oninput="filterAndDisplay()">
    </div>

    <div class="category-title"><i class="fa-solid fa-layer-group"></i> കാറ്റഗറി തിരഞ്ഞെടുക്കുക:</div>
    <div class="category-pills" id="categoryContainer"></div>
  </div>

  <div id="statusMessage" class="status-msg">
    വിവരങ്ങൾ ലോഡ് ചെയ്യുന്നു...
  </div>

  <div class="results-grid" id="resultsGrid" style="display: none;"></div>
</div>

<script>
  const SHEET_ID = '1pqVwS9RBS4bYOXvVVVzF406qUna4MwvHxq_1ElBJZ5Q';
  const SHEET_NAME = 'Sheet1';
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}&headers=0`;

  let directoryData = [];
  let selectedCategory = '';

  fetch(url)
    .then(res => res.text())
    .then(data => {
      const match = data.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\);/);
      if (!match) return;
      const json = JSON.parse(match[1]);
      const rows = json.table.rows;

      if (!rows || rows.length < 2) return;

      // ഹെഡർ പരിശോധിക്കുന്നു
      const headerRow = rows[0].c;
      let headers = headerRow.map(c => c && (c.v !== null || c.f) ? String(c.f || c.v).trim().toLowerCase() : '');

      const getIdx = (terms) => headers.findIndex(h => terms.some(t => h.includes(t)));

      const catIdx = getIdx(['category']);
      const unitIdx = getIdx(['unit', 'site name', 'office']);
      const nameIdx = getIdx(['name']);
      const desigIdx = getIdx(['designation', 'rank']);

      const categoriesSet = new Set();

      for (let i = 1; i < rows.length; i++) {
        const c = rows[i].c;
        if (!c || c.every(cell => !cell || cell.v === null || cell.v === '')) continue;

        const val = (idx) => (idx !== -1 && c[idx] && (c[idx].f || c[idx].v !== null)) ? String(c[idx].f || c[idx].v).trim() : '';

        const category = val(catIdx) || 'OTHER';
        const unit = val(unitIdx);
        const personName = val(nameIdx);
        const desig = val(desigIdx);

        // വരിയിലുള്ള എല്ലാ സെല്ലുകളും പരിശോധിച്ച് യഥാർത്ഥ ഫോൺ നമ്പർ കണ്ടെത്തുന്നു
        let phoneNum = '';
        for (let j = 0; j < c.length; j++) {
          let cellText = (c[j] && (c[j].f || c[j].v !== null)) ? String(c[j].f || c[j].v).trim() : '';
          let digitsOnly = cellText.replace(/[^0-9]/g, '');
          // 10 അക്ക മൊബൈൽ നമ്പറോ അല്ലെങ്കിൽ 7+ അക്കമുള്ള ലാൻഡ്‌ലൈനോ കണ്ടെത്തുന്നു
          if (digitsOnly.length >= 7 && digitsOnly.length <= 12) {
            phoneNum = digitsOnly;
            break;
          }
        }

        let displayTitle = personName || unit || 'വിവരങ്ങൾ';

        if (category) categoriesSet.add(category);

        directoryData.push({
          category,
          unit,
          personName,
          desig,
          phone: phoneNum,
          title: displayTitle
        });
      }

      renderCategories(Array.from(categoriesSet));
      document.getElementById('statusMessage').innerHTML = '👆 മുകളിൽ ഒരു <b>കാറ്റഗറി ക്ലിക്ക് ചെയ്യുക</b> അല്ലെങ്കിൽ <b>തിരയുക</b>.';
    })
    .catch(err => {
      document.getElementById('statusMessage').innerText = 'ഡാറ്റ ലോഡ് ചെയ്യാൻ കഴിഞ്ഞില്ല: ' + err.message;
    });

  function renderCategories(categories) {
    const container = document.getElementById('categoryContainer');
    let html = '';
    categories.forEach(cat => {
      html += `<button class="pill" onclick="selectCategory('${cat}', this)">${cat}</button>`;
    });
    container.innerHTML = html;
  }

  function selectCategory(cat, btn) {
    if (selectedCategory === cat) {
      selectedCategory = '';
      btn.classList.remove('active');
    } else {
      selectedCategory = cat;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
    }
    filterAndDisplay();
  }

  function filterAndDisplay() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const grid = document.getElementById('resultsGrid');
    const statusMsg = document.getElementById('statusMessage');

    if (!selectedCategory && !query) {
      grid.style.display = 'none';
      statusMsg.style.display = 'block';
      statusMsg.innerHTML = '👆 മുകളിൽ ഒരു <b>കാറ്റഗറി ക്ലിക്ക് ചെയ്യുക</b> അല്ലെങ്കിൽ <b>തിരയുക</b>.';
      return;
    }

    const filtered = directoryData.filter(item => {
      const matchCat = selectedCategory ? item.category === selectedCategory : true;
      const matchQuery = query ? (
        item.title.toLowerCase().includes(query) ||
        item.unit.toLowerCase().includes(query) ||
        item.category.toLowerCase().includes(query) ||
        item.phone.includes(query) ||
        item.desig.toLowerCase().includes(query)
      ) : true;
      return matchCat && matchQuery;
    });

    if (filtered.length === 0) {
      grid.style.display = 'none';
      statusMsg.style.display = 'block';
      statusMsg.innerText = 'വിവരങ്ങൾ ഒന്നും കണ്ടെത്താൻ കഴിഞ്ഞില്ല.';
      return;
    }

    statusMsg.style.display = 'none';
    grid.style.display = 'grid';

    grid.innerHTML = filtered.map(item => `
      <div class="card">
        <div>
          <span class="card-badge">${item.category}</span>
          <div class="card-title">${item.title}</div>
          <div class="card-sub">
            ${item.unit ? `🏢 <b>Unit:</b> ${item.unit}<br>` : ''}
            ${item.desig ? `💼 <b>Designation:</b> ${item.desig}<br>` : ''}
            ${item.phone ? `📞 <b>Phone:</b> ${item.phone}` : ''}
          </div>
        </div>
        
        ${item.phone ? `
          <div class="card-actions">
            <a href="tel:${item.phone}" class="btn-action btn-call"><i class="fa-solid fa-phone"></i> Call</a>
            ${item.phone.length === 10 ? `
              <a href="https://wa.me/91${item.phone}" target="_blank" class="btn-action btn-wa"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
            ` : ''}
          </div>
        ` : ''}
      </div>
    `).join('');
  }
</script>

</body>
</html>
